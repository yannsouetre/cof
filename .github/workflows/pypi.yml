# Publishes cof-cli to PyPI when a GitHub release is published (trusted publishing: no token stored).
# One-time setup on pypi.org: Account → Publishing → "Add a pending publisher":
#   PyPI project name cof-cli · owner yannsouetre · repository cof · workflow pypi.yml · environment pypi
name: Publish cof-cli to PyPI
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build cli --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
