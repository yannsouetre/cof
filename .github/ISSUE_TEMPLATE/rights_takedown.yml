name: Rights / takedown
description: A file in this repository or listed in the gallery infringes rights or the safety rules
labels: [rights]
body:
  - type: input
    id: where
    attributes: {label: Where, description: "Path or link of the file — do not attach or paste the material itself."}
    validations: {required: true}
  - type: dropdown
    id: why
    attributes:
      label: Reason
      options: [Real person without consent, Third-party character or brand without licence, Age rules, Copyrighted media (images, voice, 3D, text), Other]
    validations: {required: true}
  - type: textarea
    id: details
    attributes: {label: Details, description: "Who holds the rights, how to reach you. Anything confidential: use private reporting (see SECURITY.md)."}
