name: Format change (pre-RFC)
description: Propose a change to the specification before writing an RFC
labels: [rfc]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: "What can't be expressed or interoperated today? A real use case helps most."}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal, description: "Fields, rules, examples. Is it backward compatible for 1.x readers?"}
  - type: textarea
    id: implementations
    attributes: {label: Who would implement it, description: "Tools or platforms that would read or write it."}
